<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Dark Space Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="40%" stop-color="#0c1122" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cffafe" />
    </linearGradient>

    <!-- Subtitle Laser Line Gradient -->
    <linearGradient id="laser-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0)" />
      <stop offset="100%" stop-color="rgba(0, 229, 255, 0.7)" />
    </linearGradient>

    <linearGradient id="laser-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.7)" />
      <stop offset="100%" stop-color="rgba(0, 229, 255, 0)" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.75)" />
      <stop offset="100%" stop-color="rgba(8, 14, 28, 0.85)" />
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 229, 255, 0.035)" stroke-width="1" />
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Card Shadow -->
    <filter id="card-shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    /* Premium Font Styling */
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace;
    }

    /* Keyframe Animations */
    @keyframes title-glow {
      0%, 100% {
        filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.35));
      }
      50% {
        filter: drop-shadow(0 0 22px rgba(0, 229, 255, 0.65));
      }
    }
    .anim-title {
      animation: title-glow 4s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .dot-1 { transform-origin: 65px 209px; animation: pulse-dot 2.5s ease-in-out infinite; }
    .dot-2 { transform-origin: 350px 209px; animation: pulse-dot 2.5s ease-in-out infinite 0.7s; }
    .dot-3 { transform-origin: 635px 209px; animation: pulse-dot 2.5s ease-in-out infinite 1.4s; }

    @keyframes scan-line {
      0% { transform: translateY(18px); opacity: 0; }
      20% { opacity: 0.45; }
      80% { opacity: 0.45; }
      100% { transform: translateY(260px); opacity: 0; }
    }
    .scanner {
      animation: scan-line 5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>

  <!-- Base Card -->
  <rect width="920" height="280" rx="12" fill="url(#bg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <rect width="920" height="280" rx="12" fill="url(#grid-pattern)" />

  <!-- Outer Cyber Tech Brackets -->
  <g stroke="#00e5ff" stroke-width="1.2" fill="none" opacity="0.75">
    <!-- Top-left -->
    <path d="M 22 45 L 22 22 L 45 22" />
    <!-- Top-right -->
    <path d="M 875 22 L 898 22 L 898 45" />
    <!-- Bottom-left -->
    <path d="M 22 235 L 22 258 L 45 258" />
    <!-- Bottom-right -->
    <path d="M 875 258 L 898 258 L 898 235" />
  </g>

  <!-- Frame Border Subtle Lines -->
  <line x1="45" y1="22" x2="875" y2="22" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1" />
  <line x1="45" y1="258" x2="875" y2="258" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1" />

  <!-- Animated Scanner Line -->
  <line x1="25" y1="0" x2="895" y2="0" stroke="rgba(0, 229, 255, 0.5)" stroke-width="1.5" class="scanner" />

  <!-- ================= TOP HEADER BAR ================= -->
  <!-- Left: Status Badge -->
  <g transform="translate(45, 38)">
    <rect width="180" height="24" rx="12" fill="rgba(0, 255, 153, 0.06)" stroke="rgba(0, 255, 153, 0.3)" stroke-width="1" />
    <circle cx="16" cy="12" r="3.5" fill="#00ff99" />
    <text x="27" y="16" fill="#00ff99" class="font-mono" font-size="10px" font-weight="700" letter-spacing="1.5px">SYSTEM: ONLINE</text>
  </g>

  <!-- Right: Location & Coordinates -->
  <g transform="translate(875, 54)" text-anchor="end">
    <text fill="#64748b" class="font-mono" font-size="11px" font-weight="600" letter-spacing="1.5px">
      LOC :: <tspan fill="#94a3b8">INDIA</tspan> | ARCH :: <tspan fill="#38bdf8">X86_64</tspan>
    </text>
  </g>

  <!-- ================= HERO SECTION ================= -->
  <!-- Main Title -->
  <g class="anim-title">
    <text x="460" y="112" text-anchor="middle" fill="url(#title-grad)" class="font-sans" font-size="38px" font-weight="800" letter-spacing="6px">
      PRIYANKA PATEL
    </text>
  </g>

  <!-- Subtitle Flanked by Smooth Gradient Lines -->
  <g transform="translate(460, 140)">
    <!-- Left Gradient Line -->
    <line x1="-390" y1="-4" x2="-220" y2="-4" stroke="url(#laser-left)" stroke-width="1.2" />
    <circle cx="-220" cy="-4" r="2" fill="#00e5ff" />

    <!-- Center Subtitle Text -->
    <text x="0" y="0" text-anchor="middle" fill="#38bdf8" class="font-sans" font-size="12px" font-weight="700" letter-spacing="3px">
      SOFTWARE ENGINEER • BACKEND SYSTEMS • ALGORITHMS
    </text>

    <!-- Right Gradient Line -->
    <circle cx="220" cy="-4" r="2" fill="#00e5ff" />
    <line x1="220" y1="-4" x2="390" y2="-4" stroke="url(#laser-right)" stroke-width="1.2" />
  </g>

  <!-- ================= 3 TELEMETRY CARDS ================= -->
  <!-- CARD 1: Core Architecture -->
  <g transform="translate(45, 185)" filter="url(#card-shadow)">
    <rect width="260" height="70" rx="8" fill="url(#card-bg)" stroke="rgba(74, 222, 128, 0.25)" stroke-width="1" />
    <!-- Top Row -->
    <circle cx="20" cy="24" r="3.5" fill="#4ade80" class="dot-1" />
    <text x="32" y="27" fill="#4ade80" class="font-mono" font-size="10px" font-weight="700" letter-spacing="1.5px">CORE ARCHITECTURE</text>
    <!-- Bottom Row (Clean high-contrast value) -->
    <text x="20" y="52" fill="#f8fafc" class="font-sans" font-size="13px" font-weight="600" letter-spacing="0.3px">Data Structures &amp; DSA (C)</text>
  </g>

  <!-- CARD 2: Full-Stack Pipeline -->
  <g transform="translate(330, 185)" filter="url(#card-shadow)">
    <rect width="260" height="70" rx="8" fill="url(#card-bg)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <!-- Top Row -->
    <circle cx="20" cy="24" r="3.5" fill="#38bdf8" class="dot-2" />
    <text x="32" y="27" fill="#38bdf8" class="font-mono" font-size="10px" font-weight="700" letter-spacing="1.5px">FULL-STACK PIPELINE</text>
    <!-- Bottom Row -->
    <text x="20" y="52" fill="#f8fafc" class="font-sans" font-size="13px" font-weight="600" letter-spacing="0.3px">MERN Stack &amp; Scalable Web</text>
  </g>

  <!-- CARD 3: Engineering Mindset -->
  <g transform="translate(615, 185)" filter="url(#card-shadow)">
    <rect width="260" height="70" rx="8" fill="url(#card-bg)" stroke="rgba(251, 191, 36, 0.25)" stroke-width="1" />
    <!-- Top Row -->
    <circle cx="20" cy="24" r="3.5" fill="#fbbf24" class="dot-3" />
    <text x="32" y="27" fill="#fbbf24" class="font-mono" font-size="10px" font-weight="700" letter-spacing="1.5px">CORE PHILOSOPHY</text>
    <!-- Bottom Row -->
    <text x="20" y="52" fill="#f8fafc" class="font-sans" font-size="13px" font-weight="600" letter-spacing="0.3px">Elegant Code: Art &amp; Science</text>
  </g>
</svg>
