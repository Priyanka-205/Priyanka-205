<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090e1c" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00e5ff" flood-opacity="0.25" />
    </filter>

    <!-- Subtle Hexagon Grid Pattern -->
    <pattern id="hex-grid" width="30" height="52" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M15 0 L30 8.66 L30 26 L15 34.66 L0 26 L0 8.66 Z M15 52 L30 43.34 L30 26 L15 34.66 L0 26 L0 43.34 Z" 
            fill="none" stroke="rgba(0, 229, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(13, 22, 40, 0.85)" />
      <stop offset="100%" stop-color="rgba(7, 12, 24, 0.95)" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Consolas, 'Fira Code', monospace; }
    .title-font { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; letter-spacing: 7px; }
    .sub-font { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; letter-spacing: 4px; }
    .hud-label { font-size: 11px; letter-spacing: 2px; font-weight: 700; }
    .hud-val { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
  </style>

  <!-- Canvas Background -->
  <rect width="950" height="320" rx="14" fill="url(#bg-grad)" stroke="#1a2744" stroke-width="1.5" />
  <rect width="950" height="320" rx="14" fill="url(#hex-grid)" />

  <!-- Outer Cyber Tech Border Frame -->
  <g stroke="#00e5ff" stroke-width="1.5" fill="none">
    <!-- Top & Bottom Frame Lines -->
    <path d="M 30 25 L 920 25" stroke="rgba(0, 229, 255, 0.7)" />
    <path d="M 30 295 L 920 295" stroke="rgba(0, 229, 255, 0.7)" />

    <!-- Corner Cuts & Accents -->
    <path d="M 30 25 L 30 65" />
    <path d="M 920 25 L 920 65" />
    <path d="M 30 295 L 30 255" />
    <path d="M 920 295 L 920 255" />

    <!-- Decorative Corner Reticles -->
    <circle cx="30" cy="25" r="3" fill="#00e5ff" />
    <circle cx="920" cy="25" r="3" fill="#00e5ff" />
    <circle cx="30" cy="295" r="3" fill="#00e5ff" />
    <circle cx="920" cy="295" r="3" fill="#00e5ff" />
  </g>

  <!-- Mid Laser Grid Scanline -->
  <line x1="30" y1="135" x2="920" y2="135" stroke="rgba(0, 255, 153, 0.2)" stroke-width="1" />
  <path d="M 30 135 L 70 135 L 85 142 L 865 142 L 880 135 L 920 135" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1" />

  <!-- TOP BAR TELEMETRY -->
  <!-- Left Clearance Badge -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="220" height="28" rx="6" fill="rgba(0, 255, 153, 0.08)" stroke="#00ff99" stroke-width="1.2" />
    <text x="110" y="18" fill="#00ff99" text-anchor="middle" class="mono hud-label" filter="url(#glow-green)">// PROTOCOL : SWE-ALPHA //</text>
  </g>

  <!-- Right Telemetry Coordinates -->
  <g transform="translate(890, 60)" text-anchor="end">
    <text fill="#00e5ff" class="mono" font-size="12px" letter-spacing="2.5px" opacity="0.85">LOC :: INDIA [20.59° N] | SYS.V 3.8.4</text>
  </g>

  <!-- CENTER LOGO / NAME -->
  <!-- Neon Underglow -->
  <text x="475" y="125" text-anchor="middle" fill="#00ffcc" class="title-font" font-size="42px" filter="url(#glow-cyan)" opacity="0.95">
    PRIYANKA PATEL
  </text>
  <!-- Sharp Foreground Text -->
  <text x="475" y="125" text-anchor="middle" fill="#ffffff" class="title-font" font-size="42px">
    PRIYANKA PATEL
  </text>

  <!-- SUB-TITLE & FLANKING LASER ACCENTS -->
  <g transform="translate(475, 155)">
    <!-- Flanking Accent Lines -->
    <line x1="-390" y1="-5" x2="-230" y2="-5" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7" />
    <polygon points="-230,-7 -222,-5 -230,-3" fill="#00e5ff" />
    
    <line x1="230" y1="-5" x2="390" y2="-5" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7" />
    <polygon points="230,-7 222,-5 230,-3" fill="#00e5ff" />

    <text x="0" y="0" text-anchor="middle" fill="#00e5ff" class="mono sub-font" font-size="13px" letter-spacing="3.5px">
      SOFTWARE ENGINEER • BACKEND SYSTEMS • ALGORITHMS
    </text>
  </g>

  <!-- BOTTOM 3 TELEMETRY CARDS -->
  <!-- CARD 1: Core Architecture (DSA / C) -->
  <g transform="translate(60, 195)" filter="url(#glow-card)">
    <rect width="255" height="74" rx="8" fill="url(#card-grad)" stroke="rgba(0, 255, 153, 0.45)" stroke-width="1.2" />
    <!-- Header Row -->
    <circle cx="22" cy="24" r="4.5" fill="#00ff99" filter="url(#glow-green)" />
    <text x="35" y="28" fill="#88ffa0" class="mono hud-label">SYSTEMS ARCHITECTURE</text>
    <!-- Card Body -->
    <text x="22" y="55" fill="#00ff99" class="mono hud-val">Data Structures &amp; DSA (C)</text>
  </g>

  <!-- CARD 2: Full-Stack Engineering (MERN) -->
  <g transform="translate(347, 195)" filter="url(#glow-card)">
    <rect width="255" height="74" rx="8" fill="url(#card-grad)" stroke="rgba(0, 229, 255, 0.45)" stroke-width="1.2" />
    <!-- Header Row -->
    <circle cx="22" cy="24" r="4.5" fill="#00e5ff" filter="url(#glow-cyan)" />
    <text x="35" y="28" fill="#80e5ff" class="mono hud-label">FULL-STACK PIPELINE</text>
    <!-- Card Body -->
    <text x="22" y="55" fill="#00e5ff" class="mono hud-val">MERN Stack &amp; Scalable Web</text>
  </g>

  <!-- CARD 3: Engineering Philosophy -->
  <g transform="translate(635, 195)" filter="url(#glow-card)">
    <rect width="255" height="74" rx="8" fill="url(#card-grad)" stroke="rgba(255, 215, 0, 0.45)" stroke-width="1.2" />
    <!-- Header Row -->
    <circle cx="22" cy="24" r="4.5" fill="#ffd700" />
    <text x="35" y="28" fill="#ffe580" class="mono hud-label">CORE PHILOSOPHY</text>
    <!-- Card Body -->
    <text x="22" y="55" fill="#ffd700" class="mono hud-val">Elegant Code: Art &amp; Science</text>
  </g>
</svg>
