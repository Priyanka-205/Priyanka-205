<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#080d1e" />
      <stop offset="100%" stop-color="#03050b" />
    </linearGradient>

    <!-- Scanner Beam Gradient -->
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0)" />
      <stop offset="25%" stop-color="rgba(0, 229, 255, 0.4)" />
      <stop offset="50%" stop-color="rgba(0, 255, 180, 0.95)" />
      <stop offset="75%" stop-color="rgba(0, 229, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(0, 229, 255, 0)" />
    </linearGradient>

    <!-- Hexagon Grid Pattern -->
    <pattern id="hex-grid" width="30" height="52" patternUnits="userSpaceOnUse">
      <path d="M15 0 L30 8.66 L30 26 L15 34.66 L0 26 L0 8.66 Z M15 52 L30 43.34 L30 26 L15 34.66 L0 26 L0 43.34 Z" 
            fill="none" stroke="rgba(0, 229, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(11, 18, 35, 0.9)" />
      <stop offset="100%" stop-color="rgba(6, 10, 20, 0.95)" />
    </linearGradient>

    <!-- SVG Filters for Glows -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Consolas, 'Fira Code', monospace; }
    .title-font { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; letter-spacing: 8px; }
    .sub-font { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; letter-spacing: 3.5px; }
    .hud-label { font-size: 11px; letter-spacing: 2px; font-weight: 700; }
    .hud-val { font-size: 14px; font-weight: 700; letter-spacing: 1px; }

    /* ========================================================
       FUTURISTIC KEYFRAME ANIMATIONS
       ======================================================== */

    /* 1. Neon Title Pulse & Gentle Cyber Breathing */
    @keyframes neon-pulse {
      0%, 100% {
        opacity: 0.92;
        filter: drop-shadow(0 0 10px #00ffcc) drop-shadow(0 0 25px rgba(0, 255, 204, 0.5));
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 16px #00ffcc) drop-shadow(0 0 38px rgba(0, 255, 204, 0.85));
      }
    }
    .anim-title {
      animation: neon-pulse 3.2s ease-in-out infinite;
    }

    /* 2. Sweeping Laser Scanner Beam */
    @keyframes laser-sweep {
      0% {
        transform: translateY(25px);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(295px);
        opacity: 0;
      }
    }
    .anim-scanner {
      animation: laser-sweep 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* 3. Moving Laser Dash Lines */
    @keyframes dash-left {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -48; }
    }
    @keyframes dash-right {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 48; }
    }
    .anim-dash-left {
      animation: dash-left 1.8s linear infinite;
    }
    .anim-dash-right {
      animation: dash-right 1.8s linear infinite;
    }

    /* 4. Radar Sensor Blinking Dots */
    @keyframes radar-blink {
      0%, 100% {
        opacity: 0.5;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }
    .anim-dot-green {
      transform-origin: 22px 24px;
      animation: radar-blink 2s ease-in-out infinite;
    }
    .anim-dot-cyan {
      transform-origin: 22px 24px;
      animation: radar-blink 2s ease-in-out infinite 0.65s;
    }
    .anim-dot-gold {
      transform-origin: 22px 24px;
      animation: radar-blink 2s ease-in-out infinite 1.3s;
    }

    /* 5. Protocol Badge Outer Glow Pulse */
    @keyframes protocol-glow {
      0%, 100% {
        stroke-opacity: 0.6;
        fill: rgba(0, 255, 153, 0.06);
      }
      50% {
        stroke-opacity: 1;
        fill: rgba(0, 255, 153, 0.15);
      }
    }
    .anim-protocol {
      animation: protocol-glow 2.4s ease-in-out infinite;
    }

    /* 6. Corner Reticles Twinkle */
    @keyframes corner-twinkle {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .anim-corner {
      animation: corner-twinkle 2s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="950" height="320" rx="14" fill="url(#bg-grad)" stroke="#1a2744" stroke-width="1.5" />
  <rect width="950" height="320" rx="14" fill="url(#hex-grid)" />

  <!-- Outer Cyber Frame -->
  <g stroke="#00e5ff" stroke-width="1.5" fill="none">
    <path d="M 30 25 L 920 25" stroke="rgba(0, 229, 255, 0.7)" />
    <path d="M 30 295 L 920 295" stroke="rgba(0, 229, 255, 0.7)" />

    <!-- Corner Brackets -->
    <path d="M 30 25 L 30 65" />
    <path d="M 920 25 L 920 65" />
    <path d="M 30 295 L 30 255" />
    <path d="M 920 295 L 920 255" />

    <!-- Corner Reticles with Twinkle -->
    <circle cx="30" cy="25" r="3.5" fill="#00e5ff" class="anim-corner" />
    <circle cx="920" cy="25" r="3.5" fill="#00e5ff" class="anim-corner" />
    <circle cx="30" cy="295" r="3.5" fill="#00e5ff" class="anim-corner" />
    <circle cx="920" cy="295" r="3.5" fill="#00e5ff" class="anim-corner" />
  </g>

  <!-- Animated Laser Scanner Sweep -->
  <line x1="30" y1="0" x2="920" y2="0" stroke="url(#scan-grad)" stroke-width="2.5" class="anim-scanner" />

  <!-- Static Midline Accent -->
  <line x1="30" y1="135" x2="920" y2="135" stroke="rgba(0, 255, 153, 0.2)" stroke-width="1" />
  <path d="M 30 135 L 70 135 L 85 142 L 865 142 L 880 135 L 920 135" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1" />

  <!-- TOP BAR TELEMETRY -->
  <!-- Left Clearance Badge with Glowing Pulse -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="220" height="28" rx="6" stroke="#00ff99" stroke-width="1.3" class="anim-protocol" />
    <text x="110" y="18" fill="#00ff99" text-anchor="middle" class="mono hud-label" filter="url(#glow-green)">// PROTOCOL : SWE-ALPHA //</text>
  </g>

  <!-- Right Telemetry Stream -->
  <g transform="translate(890, 60)" text-anchor="end">
    <text fill="#00e5ff" class="mono" font-size="12px" letter-spacing="2.5px" opacity="0.85">LOC :: INDIA [20.59° N] | SYS.V 3.8.4</text>
  </g>

  <!-- CENTER LOGO: PRIYANKA PATEL WITH NEON PULSE -->
  <g class="anim-title">
    <text x="475" y="125" text-anchor="middle" fill="#00ffcc" class="title-font" font-size="42px" filter="url(#glow-cyan)">
      PRIYANKA PATEL
    </text>
    <text x="475" y="125" text-anchor="middle" fill="#ffffff" class="title-font" font-size="42px">
      PRIYANKA PATEL
    </text>
  </g>

  <!-- SUBTITLE & MOVING LASER DASH LINES -->
  <g transform="translate(475, 155)">
    <!-- Left Moving Laser Line -->
    <line x1="-390" y1="-5" x2="-230" y2="-5" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="10 5" class="anim-dash-left" opacity="0.75" />
    <polygon points="-230,-7 -222,-5 -230,-3" fill="#00e5ff" />
    
    <!-- Right Moving Laser Line -->
    <line x1="230" y1="-5" x2="390" y2="-5" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="10 5" class="anim-dash-right" opacity="0.75" />
    <polygon points="230,-7 222,-5 230,-3" fill="#00e5ff" />

    <text x="0" y="0" text-anchor="middle" fill="#00e5ff" class="mono sub-font" font-size="13px" letter-spacing="3.5px">
      SOFTWARE ENGINEER • BACKEND SYSTEMS • ALGORITHMS
    </text>
  </g>

  <!-- BOTTOM 3 TELEMETRY CARDS WITH RADAR PULSING SENSORS -->
  <!-- CARD 1: Core Architecture -->
  <g transform="translate(60, 195)">
    <rect width="255" height="74" rx="8" fill="url(#card-grad)" stroke="rgba(0, 255, 153, 0.5)" stroke-width="1.2" />
    <circle cx="22" cy="24" r="4.5" fill="#00ff99" filter="url(#glow-green)" class="anim-dot-green" />
    <text x="35" y="28" fill="#88ffa0" class="mono hud-label">SYSTEMS ARCHITECTURE</text>
    <text x="22" y="55" fill="#00ff99" class="mono hud-val">Data Structures &amp; DSA (C)</text>
  </g>

  <!-- CARD 2: Full-Stack Engineering -->
  <g transform="translate(347, 195)">
    <rect width="255" height="74" rx="8" fill="url(#card-grad)" stroke="rgba(0, 229, 255, 0.5)" stroke-width="1.2" />
    <circle cx="22" cy="24" r="4.5" fill="#00e5ff" filter="url(#glow-cyan)" class="anim-dot-cyan" />
    <text x="35" y="28" fill="#80e5ff" class="mono hud-label">FULL-STACK PIPELINE</text>
    <text x="22" y="55" fill="#00e5ff" class="mono hud-val">MERN Stack &amp; Scalable Web</text>
  </g>

  <!-- CARD 3: Core Philosophy -->
  <g transform="translate(635, 195)">
    <rect width="255" height="74" rx="8" fill="url(#card-grad)" stroke="rgba(255, 215, 0, 0.5)" stroke-width="1.2" />
    <circle cx="22" cy="24" r="4.5" fill="#ffd700" class="anim-dot-gold" />
    <text x="35" y="28" fill="#ffe580" class="mono hud-label">CORE PHILOSOPHY</text>
    <text x="22" y="55" fill="#ffd700" class="mono hud-val">Elegant Code: Art &amp; Science</text>
  </g>
</svg>
